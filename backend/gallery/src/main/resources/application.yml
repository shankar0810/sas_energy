server:
  port: 3335

spring:
  application:
    name: gallery-service

  datasource:
    url: jdbc:mysql://localhost:3306/sas_energy
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration (must match your user service)
jwt:
  secret: 
  expiration: 86400000 # 24 hours

# Cloudinary Configuration
cloudinary:
  cloud-name: dadhrmy3u
  api-key: 145766125283879
  api-secret: _cb0API0Yfg8ryeu8M0dh0l7h2M

# Logging
logging:
  level:
    com.sas.gallery: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
